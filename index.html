<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novel Notes - 大人可愛い執筆ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #fdfaf7;
            --accent-color: #d4a373;
            --sub-color: #e9edc9;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
            --pink-accent: #f4d3d3;
            --danger-color: #e5989b;
            --shadow: 0 4px 12px rgba(212, 163, 115, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Sawarabi Mincho", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--pink-accent);
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 100px;
        }

        /* キャラクターカード */
        .char-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent-color);
            box-shadow: var(--shadow);
            position: relative;
        }

        .tag {
            display: inline-block;
            background: var(--pink-accent);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .char-actions {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* 編集モーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-color);
            width: 90%;
            max-height: 80vh;
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-field {
            margin-bottom: 15px;
        }

        .modal-field label {
            display: block;
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .modal-input, .modal-textarea {
            width: 100%;
            border: 1px solid var(--pink-accent);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* 構成ボックス */
        .plot-box {
            background: var(--card-bg);
            border: none;
            padding: 16px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        .reorder-handle { cursor: grab; color: var(--accent-color); opacity: 0.6; }

        .plot-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-color);
        }

        /* 執筆エリア */
        .split-editor { display: flex; flex-direction: column; gap: 20px; }
        .pane { position: relative; }
        .pane-label {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .char-ref-btn {
            background: var(--pink-accent);
            border: none;
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .plot-selector {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--pink-accent);
            border-radius: 10px;
            background: white;
            font-family: inherit;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        textarea {
            width: 100%;
            border: 1px solid var(--pink-accent);
            border-radius: 12px;
            padding: 15px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            line-height: 1.8;
            font-size: 1rem;
        }

        /* 長文対応：高さを動的に確保 */
        .draft-area { height: 160px; }
        .final-area { height: 400px; }

        .word-count { font-size: 0.7rem; color: #999; }

        /* ナビゲーション */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--pink-accent);
            z-index: 100;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .nav-item { font-size: 0.8rem; text-align: center; color: #b5b5b5; cursor: pointer; }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }

        .btn-round {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-small { background: none; border: none; color: #aaa; font-size: 0.75rem; cursor: pointer; }
        .btn-delete { color: var(--danger-color); }

        #char-ref-area {
            position: fixed;
            bottom: 80px;
            left: 15px;
            right: 15px;
            max-height: 40vh;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--pink-accent);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            z-index: 101;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>Novel Notes</header>

<main id="app-content"></main>

<div id="modal-container"></div>

<nav>
    <div class="nav-item active" onclick="switchMode('設定')">設定</div>
    <div class="nav-item" onclick="switchMode('構成')">構成</div>
    <div class="nav-item" onclick="switchMode('執筆')">執筆</div>
</nav>

<script>
    // --- データ管理 ---
    let data = JSON.parse(localStorage.getItem('novelData')) || {
        characters: [
            { id: 1, tag: '主人公', name: 'アリシア', note: '王立図書館の司書。口癖：「知識は重罪よ」' },
            { id: 2, tag: 'ライバル', name: 'エドワード', note: '隣国の魔術師。実は甘党。' }
        ],
        plots: [
            { id: 1, text: '出会いのシーン', draft: '', final: '' },
            { id: 2, text: '図書館での対立', draft: '', final: '' }
        ],
        currentPlotId: null // 現在執筆中のプロットIDを保持
    };

    // 旧データ形式からの移行対応（draft/finalがない場合）
    data.plots.forEach(p => {
        if (p.draft === undefined) p.draft = '';
        if (p.final === undefined) p.final = '';
    });

    function saveData() {
        localStorage.setItem('novelData', JSON.stringify(data));
    }

    const content = document.getElementById('app-content');

    // --- モード切り替え ---
    function switchMode(mode) {
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.innerText === mode);
        });
        render(mode);
    }

    function render(mode) {
        if (mode === '設定') renderSettings();
        else if (mode === '構成') renderPlot();
        else if (mode === '執筆') renderWriting();
    }

    // --- ① 設定画面（キャラクター） ---
    function renderSettings() {
        content.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--accent-color); margin:0;">Character Library</h3>
                <button class="btn-round" onclick="openCharModal()">+ Add</button>
            </div>
            <div id="char-list"></div>
        `;
        const list = document.getElementById('char-list');
        data.characters.forEach(char => {
            const card = document.createElement('div');
            card.className = 'char-card';
            card.innerHTML = `
                <div class="char-actions">
                    <button class="btn-small" onclick="openCharModal(${char.id})">編集</button>
                    <button class="btn-small btn-delete" onclick="deleteCharacter(${char.id})">削除</button>
                </div>
                <span class="tag">#${char.tag}</span>
                <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 5px;">${char.name}</div>
                <p style="font-size: 0.85rem; white-space: pre-wrap; margin:0;">${char.note}</p>
            `;
            list.appendChild(card);
        });
    }

    function openCharModal(id = null) {
        const char = data.characters.find(c => c.id === id) || { name: '', tag: '新設定', note: '' };
        const modalContainer = document.getElementById('modal-container');
        
        modalContainer.innerHTML = `
            <div class="modal-overlay">
                <div class="modal-content">
                    <h3 style="color:var(--accent-color); margin-top:0;">Character Profile</h3>
                    <div class="modal-field">
                        <label>名前</label>
                        <input type="text" id="edit-char-name" class="modal-input" value="${char.name}" placeholder="名前を入力...">
                    </div>
                    <div class="modal-field">
                        <label>タグ</label>
                        <input type="text" id="edit-char-tag" class="modal-input" value="${char.tag}" placeholder="例：主人公、敵役など">
                    </div>
                    <div class="modal-field">
                        <label>設定メモ</label>
                        <textarea id="edit-char-note" class="modal-textarea" rows="6" placeholder="性格、容姿、動機など...">${char.note}</textarea>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-round" style="flex:1;" onclick="saveCharacter(${id})">保存</button>
                        <button class="btn-round" style="flex:1; background:#ccc;" onclick="closeModal()">キャンセル</button>
                    </div>
                </div>
            </div>
        `;
    }

    function closeModal() {
        document.getElementById('modal-container').innerHTML = '';
    }

    function saveCharacter(id) {
        const name = document.getElementById('edit-char-name').value;
        const tag = document.getElementById('edit-char-tag').value;
        const note = document.getElementById('edit-char-note').value;
        if (!name) return alert("名前を入力してください");
        if (id) {
            const char = data.characters.find(c => c.id === id);
            char.name = name; char.tag = tag; char.note = note;
        } else {
            data.characters.push({ id: Date.now(), name, tag, note });
        }
        saveData(); closeModal(); renderSettings();
    }

    function deleteCharacter(id) {
        if (confirm("削除してもよろしいですか？")) {
            data.characters = data.characters.filter(c => c.id !== id);
            saveData(); renderSettings();
        }
    }

    // --- ② 構成画面 ---
    function renderPlot() {
        content.innerHTML = `
            <h3 style="color: var(--accent-color);">Plot Construction</h3>
            <div id="plot-list"></div>
            <button class="btn-round" style="width:100%; margin-top:15px;" onclick="addPlot()">+ ボックスを追加</button>
        `;
        const list = document.getElementById('plot-list');
        data.plots.forEach(plot => {
            const item = document.createElement('div');
            item.className = 'plot-box';
            item.dataset.id = plot.id;
            item.innerHTML = `
                <span class="reorder-handle">☰</span>
                <input type="text" class="plot-input" value="${plot.text}" onchange="updatePlot(${plot.id}, this.value)">
                <button class="btn-small btn-delete" onclick="deletePlot(${plot.id})">×</button>
            `;
            list.appendChild(item);
        });

        new Sortable(list, {
            handle: '.reorder-handle',
            animation: 150,
            onEnd: () => {
                const newOrder = Array.from(list.children).map(el => {
                    return data.plots.find(p => p.id == el.dataset.id);
                });
                data.plots = newOrder;
                saveData();
            }
        });
    }

    function addPlot() {
        data.plots.push({ id: Date.now(), text: '新しいシーン', draft: '', final: '' });
        saveData(); renderPlot();
    }

    function updatePlot(id, val) {
        const plot = data.plots.find(p => p.id === id);
        plot.text = val;
        saveData();
    }

    function deletePlot(id) {
        if (confirm("この構成ボックスと、紐付いた執筆データも削除されます。よろしいですか？")) {
            data.plots = data.plots.filter(p => p.id !== id);
            if (data.currentPlotId === id) data.currentPlotId = null;
            saveData(); renderPlot();
        }
    }

    // --- ③ 執筆画面（構成ボックス紐付け版） ---
    function renderWriting() {
        // 執筆対象が未選択かつプロットが存在する場合、最初のプロットを選択状態にする
        if (!data.currentPlotId && data.plots.length > 0) {
            data.currentPlotId = data.plots[0].id;
        }

        const currentPlot = data.plots.find(p => p.id == data.currentPlotId) || { draft: '', final: '' };

        content.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
                <h3 style="color: var(--accent-color); margin:0;">Draft & Final</h3>
                <button class="char-ref-btn" onclick="showCharRef()">設定を参照</button>
            </div>

            <select class="plot-selector" onchange="changeTargetPlot(this.value)">
                ${data.plots.length === 0 ? '<option value="">構成ボックスがありません</option>' : ''}
                ${data.plots.map(p => `<option value="${p.id}" ${p.id == data.currentPlotId ? 'selected' : ''}>${p.text}</option>`).join('')}
            </select>
            
            <div id="char-ref-area" class="hidden"></div>

            <div class="split-editor">
                <div class="pane">
                    <div class="pane-label">
                        <span>DRAFT (アイディア)</span>
                        <span id="count-draft" class="word-count">0文字</span>
                    </div>
                    <textarea class="draft-area" id="draft-text" placeholder="アイディアを自由に...">${currentPlot.draft || ''}</textarea>
                </div>
                <div class="pane">
                    <div class="pane-label">
                        <span>FINAL (本文)</span>
                        <span id="count-final" class="word-count">0文字</span>
                    </div>
                    <textarea class="final-area" id="final-text" placeholder="本番の文章を書く...">${currentPlot.final || ''}</textarea>
                </div>
            </div>
        `;

        const draftEl = document.getElementById('draft-text');
        const finalEl = document.getElementById('final-text');

        const updateCounts = () => {
            document.getElementById('count-draft').innerText = `${draftEl.value.length}文字`;
            document.getElementById('count-final').innerText = `${finalEl.value.length}文字`;
        };

        const handleInput = () => {
            if (!data.currentPlotId) return;
            const plot = data.plots.find(p => p.id == data.currentPlotId);
            if (plot) {
                plot.draft = draftEl.value;
                plot.final = finalEl.value;
                saveData();
                updateCounts();
            }
        };

        draftEl.addEventListener('input', handleInput);
        finalEl.addEventListener('input', handleInput);
        updateCounts();
    }

    function changeTargetPlot(id) {
        data.currentPlotId = id;
        saveData();
        renderWriting();
    }

    function showCharRef() {
        const refArea = document.getElementById('char-ref-area');
        refArea.classList.toggle('hidden');
        if (!refArea.classList.contains('hidden')) {
            refArea.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid var(--pink-accent); padding-bottom:5px;">
                    <strong style="color:var(--accent-color)">Reference</strong>
                    <span onclick="showCharRef()" style="cursor:pointer">× Close</span>
                </div>
                ${data.characters.map(c => `
                    <div style="margin-bottom:10px;">
                        <span class="tag">#${c.tag}</span> <b>${c.name}</b>
                        <div style="font-size:0.8rem; color:#666; margin-top:3px;">${c.note}</div>
                    </div>
                `).join('<hr style="border:0; border-top:1px solid #eee; margin:8px 0;">')}
            `;
        }
    }

    // 初期表示
    render('設定');
</script>

</body>
</html>
