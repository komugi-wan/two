<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dusky Pink Shopping Calc</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #d4a3a3; /* くすみピンク */
            --soft-pink: #e9d5d5;
            --light-pink: #fdf8f8;
            --accent-gold: #b8944d;
            --text-color: #5a4a4a;
            --white: #ffffff;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--light-pink);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .header-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            color: var(--main-pink);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* セット（店舗）のカード */
        .shop-card {
            background: var(--white);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(212, 163, 163, 0.15);
            border: 1px solid rgba(184, 148, 77, 0.1);
            position: relative;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .shop-title {
            font-size: 1.4rem;
            border: none;
            border-bottom: 2px solid var(--soft-pink);
            color: var(--main-pink);
            width: 60%;
            padding: 5px;
            outline: none;
            font-weight: 500;
        }

        /* 特典設定エリア */
        .bonus-badge {
            background: var(--light-pink);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 4px solid var(--accent-gold);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 商品テーブル風レイアウト */
        .item-list-header {
            display: grid;
            grid-template-columns: 60px 2fr 1fr 80px 100px 40px;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--main-pink);
            margin-bottom: 10px;
            padding: 0 10px;
            font-weight: bold;
        }

        .item-row {
            display: grid;
            grid-template-columns: 60px 2fr 1fr 80px 100px 40px;
            gap: 10px;
            align-items: center;
            background: var(--white);
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .item-row:hover {
            border-color: var(--soft-pink);
        }

        /* 画像アップロード */
        .img-upload {
            width: 50px;
            height: 50px;
            border: 1px dashed var(--soft-pink);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            font-size: 0.7rem;
            color: var(--soft-pink);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
            color: var(--text-color);
        }

        .subtotal-text {
            text-align: right;
            color: var(--accent-gold);
            font-weight: 500;
        }

        /* 合計エリア */
        .footer-summary {
            margin-top: 30px;
            text-align: right;
            border-top: 1px solid var(--light-pink);
            padding-top: 20px;
        }

        .total-price {
            font-size: 2rem;
            color: var(--main-pink);
            font-family: 'Playfair Display', serif;
        }

        .bonus-info {
            color: var(--accent-gold);
            font-size: 1rem;
            margin-top: 5px;
        }

        /* ボタン */
        .btn {
            cursor: pointer;
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .btn-add-item { background: var(--soft-pink); color: var(--text-color); }
        .btn-duplicate { background: var(--white); border: 1px solid var(--main-pink); color: var(--main-pink); }
        .btn-remove { background: #fdf1f1; color: #d4a3a3; }
        .btn-main-add { 
            background: var(--main-pink); color: white; 
            padding: 15px 40px; font-size: 1.1rem; 
            display: block; margin: 30px auto;
            box-shadow: 0 10px 20px rgba(212, 163, 163, 0.3);
        }

        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="header-title">Shopping Atelier</div>

    <div id="app" class="container">
        </div>

    <button class="btn btn-main-add" onclick="addSet()">+ Add New Shop</button>

    <script>
        let setCounter = 0;

        // セットの追加
        function addSet(savedData = null) {
            setCounter++;
            const setId = `set-${setCounter}`;
            const app = document.getElementById('app');
            
            const setHtml = `
                <div class="shop-card" id="${setId}">
                    <div class="shop-header">
                        <input type="text" class="shop-title" placeholder="Shop Name" value="${savedData ? savedData.title : ''}">
                        <button class="btn btn-remove" onclick="removeElement('${setId}')">Delete</button>
                    </div>

                    <div class="bonus-badge">
                        <span>特典条件:</span>
                        <input type="number" class="bonus-unit" value="${savedData ? savedData.bonusUnit : 5000}" oninput="calculate('${setId}')">
                        <span>円ごとに1個プレゼント</span>
                    </div>

                    <div class="item-list-header">
                        <span>画像</span><span>商品名</span><span>単価</span><span>個数</span><span>小計</span><span></span>
                    </div>

                    <div class="items-container" id="items-${setId}"></div>

                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button class="btn btn-add-item" onclick="addItem('${setId}')">+ 商品を追加</button>
                        <button class="btn btn-duplicate" onclick="duplicateSet('${setId}')">セットを複製</button>
                    </div>

                    <div class="footer-summary">
                        <div class="total-price">Total: ¥<span class="total-val">0</span></div>
                        <div class="bonus-info">
                            特典: <strong class="bonus-count">0</strong> 個獲得中<br>
                            <small>（次の特典まであと ¥<span class="next-bonus">0</span>）</small>
                        </div>
                    </div>
                </div>
            `;
            
            app.insertAdjacentHTML('beforeend', setHtml);

            if (savedData && savedData.items) {
                savedData.items.forEach(item => addItem(setId, item));
            } else {
                addItem(setId);
            }
            calculate(setId);
        }

        // 商品行の追加
        function addItem(setId, itemData = null) {
            const container = document.getElementById(`items-${setId}`);
            const itemRow = document.createElement('div');
            itemRow.className = 'item-row';
            
            const randomId = Math.random().toString(36).substr(2, 9);
            
            itemRow.innerHTML = `
                <label class="img-upload" id="label-${randomId}" style="background-image: url(${itemData?.img || ''})">
                    ${itemData?.img ? '' : '+'}
                    <input type="file" hidden accept="image/*" onchange="handleImage(this, 'label-${randomId}')">
                </label>
                <input type="text" class="p-name" placeholder="商品名" value="${itemData ? itemData.name : ''}" oninput="saveAll()">
                <input type="number" class="p-price" placeholder="0" value="${itemData ? itemData.price : ''}" oninput="calculate('${setId}')">
                <input type="number" class="p-qty" value="${itemData ? itemData.qty : 1}" oninput="calculate('${setId}')">
                <div class="subtotal-text">¥0</div>
                <button class="btn btn-remove" style="padding: 5px;" onclick="this.parentElement.remove(); calculate('${setId}')">✕</button>
            `;
            container.appendChild(itemRow);
        }

        // 画像プレビュー処理
        function handleImage(input, labelId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const label = document.getElementById(labelId);
                    label.style.backgroundImage = `url(${e.target.result})`;
                    label.innerText = '';
                    saveAll();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 計算ロジック
        function calculate(setId) {
            const set = document.getElementById(setId);
            const rows = set.querySelectorAll('.item-row');
            let total = 0;

            rows.forEach(row => {
                const price = parseFloat(row.querySelector('.p-price').value) || 0;
                const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                const sub = price * qty;
                row.querySelector('.subtotal-text').textContent = `¥${sub.toLocaleString()}`;
                total += sub;
            });

            const unit = parseFloat(set.querySelector('.bonus-unit').value) || 1;
            const count = Math.floor(total / unit);
            const next = unit - (total % unit);

            set.querySelector('.total-val').textContent = total.toLocaleString();
            set.querySelector('.bonus-count').textContent = count;
            set.querySelector('.next-bonus').textContent = next.toLocaleString();
            
            saveAll();
        }

        // 複製機能
        function duplicateSet(setId) {
            const set = document.getElementById(setId);
            const data = {
                title: set.querySelector('.shop-title').value + " (Copy)",
                bonusUnit: set.querySelector('.bonus-unit').value,
                items: []
            };
            set.querySelectorAll('.item-row').forEach(row => {
                data.items.push({
                    img: row.querySelector('.img-upload').style.backgroundImage.slice(5, -2),
                    name: row.querySelector('.p-name').value,
                    price: row.querySelector('.p-price').value,
                    qty: row.querySelector('.p-qty').value
                });
            });
            addSet(data);
        }

        function removeElement(id) {
            if(confirm('このセットを削除してもよろしいですか？')) {
                document.getElementById(id).remove();
                saveAll();
            }
        }

        // ローカルストレージへの自動保存
        function saveAll() {
            const allData = [];
            document.querySelectorAll('.shop-card').forEach(set => {
                const items = [];
                set.querySelectorAll('.item-row').forEach(row => {
                    items.push({
                        img: row.querySelector('.img-upload').style.backgroundImage.slice(5, -2).replace(/"/g, ""),
                        name: row.querySelector('.p-name').value,
                        price: row.querySelector('.p-price').value,
                        qty: row.querySelector('.p-qty').value
                    });
                });
                allData.push({
                    title: set.querySelector('.shop-title').value,
                    bonusUnit: set.querySelector('.bonus-unit').value,
                    items: items
                });
            });
            localStorage.setItem('shoppingAppData', JSON.stringify(allData));
        }

        // 読み込み
        function loadAll() {
            const data = JSON.parse(localStorage.getItem('shoppingAppData'));
            if (data && data.length > 0) {
                data.forEach(d => addSet(d));
            } else {
                addSet();
            }
        }

        window.onload = loadAll;
    </script>
</body>
</html>
